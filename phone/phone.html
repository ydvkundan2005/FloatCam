<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src wss: https:; base-uri 'none'; form-action 'none';"
  />
  <title>FPC — Floating Phone Camera</title>
  <link rel="stylesheet" href="phone.css" />
</head>
<body>
  <video id="localVideo" autoplay muted playsinline></video>

  <!-- Top Status Badge -->
  <header class="top-bar">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">Connecting…</span>
  </header>

  <!-- Error / Help Overlay Modal -->
  <div id="errorModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-icon" id="modalIcon">⚠️</div>
      <h3 id="modalTitle">Camera Permission Needed</h3>
      <p id="modalBody">Please allow camera access in your browser settings so your Mac can receive the video feed.</p>
      <div class="modal-actions">
        <button id="modalRetryBtn" class="ctrl-btn primary">Try Again</button>
        <button id="modalCloseBtn" class="ctrl-btn secondary">Dismiss</button>
      </div>
    </div>
  </div>

  <!-- Bottom Control Bar -->
  <nav class="bottom-bar">
    <button id="switchBtn" class="ctrl-btn secondary" disabled title="Flip camera">
      <span class="btn-icon">🔄</span> Flip Camera
    </button>
    <button id="startBtn" class="ctrl-btn primary">
      <span class="btn-icon">📹</span> Start Camera
    </button>
  </nav>

  <!-- Footer Help / Info -->
  <footer class="footer-info">
    <div class="hint-text">
      Video streams securely over your local Wi-Fi directly to your Mac.
    </div>
    <div class="cert-link-row">
      <a href="/ca.crt" class="cert-link" download="FPC-Local-CA.crt">
        🛡️ Install CA Profile for zero warnings
      </a>
    </div>
  </footer>

  <script src="phone.js"></script>
</body>
</html>
