<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Dark Glassmorphism Squircle Gradient -->
    <linearGradient id="squircleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="50%" stop-color="#080808" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Glass Rim Highlight -->
    <linearGradient id="rimHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="30%" stop-color="#71717a" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#27272a" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08" />
    </linearGradient>

    <!-- Inner Lens Radial Gradient -->
    <radialGradient id="innerLens" cx="48%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#2a2a2e" />
      <stop offset="65%" stop-color="#141416" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>

    <!-- Red Recording Indicator Glow -->
    <filter id="redGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="22" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Pitch Black Canvas -->
  <rect width="1024" height="1024" fill="#000000" rx="230" />

  <!-- App Icon Base: Pitch Black Squircle with Subtle Glass Border -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#squircleBg)" stroke="url(#rimHighlight)" stroke-width="4" />

  <!-- Subtle Minimalist Crosshair/Grid Accents (White & Grey) -->
  <g opacity="0.25">
    <line x1="512" y1="140" x2="512" y2="190" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <line x1="512" y1="834" x2="512" y2="884" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <line x1="140" y1="512" x2="190" y2="512" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <line x1="834" y1="512" x2="884" y2="512" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Outer Glass Ring / Viewfinder -->
  <circle cx="512" cy="512" r="320" fill="none" stroke="#27272a" stroke-width="6" stroke-dasharray="8 8" opacity="0.6" />
  <circle cx="512" cy="512" r="280" fill="none" stroke="#3f3f46" stroke-width="3" opacity="0.8" />

  <!-- Main Camera Lens Circle Body -->
  <circle cx="512" cy="512" r="236" fill="url(#innerLens)" stroke="#ffffff" stroke-width="14" />

  <!-- Inner Concentric Lens Precision Ring -->
  <circle cx="512" cy="512" r="160" fill="#0a0a0c" stroke="#52525b" stroke-width="6" />

  <!-- Floating Minimalist Aperture Core -->
  <circle cx="512" cy="512" r="92" fill="#000000" stroke="#71717a" stroke-width="4" />

  <!-- Glass Arc Reflection -->
  <path d="M 370 410 A 180 180 0 0 1 610 350" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.38" />

  <!-- Center Floating Core Dot -->
  <circle cx="512" cy="512" r="28" fill="#ffffff" opacity="0.9" />

  <!-- Signature Ruby/Crimson RED Recording Indicator Dot -->
  <g filter="url(#redGlow)">
    <circle cx="700" cy="324" r="38" fill="#ef4444" />
    <circle cx="700" cy="324" r="14" fill="#ffffff" opacity="0.6" />
  </g>

  <!-- Version / Subtle Model Typography: "2.0" -->
  <text x="512" y="780" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="34" font-weight="700" letter-spacing="9" fill="#71717a">FLOATCAM</text>
</svg>