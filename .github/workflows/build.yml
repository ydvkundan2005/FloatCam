name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        node-version: [18.x, 20.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  build-macos:
    name: Package macOS Application
    needs: test
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build macOS DMG
        run: npm run build:mac

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloatCam-v3-macOS-DMG
          path: dist/FloatCam-v3.dmg
          if-no-files-found: error

  build-windows:
    name: Package Windows Application
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Windows Distribution
        run: npm run build:win

      - name: Upload Windows Setup Installer
        uses: actions/upload-artifact@v4
        with:
          name: FloatCam-Setup-v3
          path: dist/installer/FloatCam-Setup-v3.exe
          if-no-files-found: error

      - name: Upload Windows Portable Executable
        uses: actions/upload-artifact@v4
        with:
          name: FloatCam-v3-Portable
          path: dist/installer/FloatCam-v3-Portable.exe
          if-no-files-found: warn

      - name: Upload Windows ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloatCam-v3-Windows-x64-ZIP
          path: dist/FloatCam-v3-Windows-x64.zip
          if-no-files-found: error
